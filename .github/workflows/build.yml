name: Build TheBeast

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - run: dotnet build TheBeast.csproj -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: TheBeast-build
          path: bin/Release/net6.0/
